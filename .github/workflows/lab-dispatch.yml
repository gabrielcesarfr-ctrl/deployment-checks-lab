name: Lab dispatch driver
on:
  push:
    branches: [final-lab-dispatch]
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch only the lab general workflow
        run: gh workflow run check.yml --repo gabrielcesarfr-ctrl/deployment-checks-lab --ref main
